[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-annotator"
version = "0.1.0"
description = "Interactively segment videos (e.g. robot task demonstrations) into non-overlapping, labeled skills using mpv."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-mpv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
annotate-videos = "video_annotator.cli:main"

[tool.setuptools.packages.find]
include = ["video_annotator*"]
